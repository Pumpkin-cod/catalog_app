<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Catalog App - Products</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/products.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="catalog-container">
    <header class="catalog-header">
      <h1>Product Catalog</h1>
      <div class="user-bar">
        <span class="welcome-text">Welcome, {{ username }}</span>
        <a href="/logout" class="logout-button" aria-label="Logout">
          <i class="fas fa-sign-out-alt"></i> Logout
        </a>
      </div>
    </header>

    <section class="search-section">
      <input type="text" id="search-input" placeholder="Search products..." />
      <button id="search-button" aria-label="Search">
        <i class="fas fa-search"></i>
      </button>
    </section>

    <main class="catalog-content">
      <table class="products-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for product in products %}
          <tr>
            <td>{{ product.id }}</td>
            <td>{{ product.name }}</td>
            <td>{{ product.description }}</td>
            <td>${{ "%.2f"|format(product.price) }}</td>
            <td>
              <button class="view-button" data-id="{{ product.id }}" aria-label="View {{ product.name }}">
                <i class="fas fa-eye"></i>
              </button>
              <button class="edit-button" data-id="{{ product.id }}" aria-label="Edit {{ product.name }}">
                <i class="fas fa-edit"></i>
              </button>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </main>
  </div>

  <div id="product-modal" class="modal">
    <div class="modal-content">
      <span class="modal-close" aria-label="Close">&times;</span>
      <div id="modal-product-details"></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/products.js') }}"></script>
</body>
</html>
